l_spanish:
  COUNTRY_PLANET_STATE: "Planeta-Estado"
  COUNTRY_PLANET_STATE_DESC: "Tan antiguos como los Imperios Caídos, estos países pequeños se abstuvieron conscientemente de los asuntos galácticos y nunca se expandieron a otros planetas. Gran parte de su poder y prosperidad es probablemente consecuencia de ello."
  CAN_TAKE_HOSTILE_ACTION_PLANET_STATE: "Solo podemos tomar acciones hostiles contra un Planeta-Estado dentro de nuestras fronteras."
  origin_planet_state: "Planeta-Estado"
  origin_planet_state_effects: "Esta civilización nunca abandonó su mundo natal. Toda su historia es la historia de un solo planeta."
  planet_state_station: "Estación del Planeta-Estado"
  planet_state_station_plural: "Estaciones del Planeta-Estado"
  gov_planet_state_egalitarian: "Planeta-Estado"
  gov_planet_state_egalitarian_desc: "Un planeta soberano e independiente, más preocupado por la prosperidad de sus ciudadanos que por los asuntos galácticos."
  RT_PS_EGALITARIAN: "Primer Portavoz"
  gov_planet_state_authoritarian: "$gov_planet_state_egalitarian$"
  gov_planet_state_authoritarian_desc: "$gov_planet_state_egalitarian_desc$"
  RT_PS_AUTHORITARIAN: "Gran Príncipe"
  gov_planet_state_militarist: "$gov_planet_state_egalitarian$"
  gov_planet_state_militarist_desc: "$gov_planet_state_egalitarian_desc$"
  RT_PS_MILITARIST: "Reina"
  gov_planet_state_pacifist: "$gov_planet_state_egalitarian$"
  gov_planet_state_pacifist_desc: "$gov_planet_state_egalitarian_desc$"
  RT_PS_PACIFIST: "Arconte"
  civic_planet_state: "Planeta-Estado"
  civic_planet_state_desc: "Esta sociedad se abstuvo conscientemente de expandirse a otros planetas, priorizando su propia prosperidad y estabilidad por encima de cualquier sueño imperial."
  building_ps_capitol: "Capitolio del Planeta-Estado"
  building_ps_capitol_desc: "El centro administrativo del Planeta-Estado. Increíblemente avanzado y eficiente para su tamaño, igual que su país."
  building_ps_anti_matter_reactor: "Reactor de antimateria"
  building_ps_anti_matter_reactor_desc: "Un método de generación de energía extremadamente peligroso, pero igual de eficiente."
  building_ps_aeroponics_farms_complex: "Complejo de granjas aeropónicas"
  building_ps_aeroponics_farms_complex_desc: "Las granjas aeropónicas usan menos espacio y agua que otros métodos, y aumentan el valor nutricional de los alimentos."
  building_ps_mineral_purification_complex: "Complejo de purificación mineral"
  building_ps_mineral_purification_complex_desc: "Con tecnologías avanzadas de extracción, almacenamiento y purificación, estas instalaciones alcanzan una eficiencia casi incomparable."
  building_ps_multidimensional_printers: "Impresoras multidimensionales"
  building_ps_multidimensional_printers_desc: "Estas instalaciones pueden imprimir cualquier bien concebible (y al menos cinco inconcebibles) en un abrir y cerrar de ojos."
  building_ps_leisure_complex: "Complejo de ocio"
  building_ps_leisure_complex_desc: "Te ofrece cosas que ni siquiera sabías que deseabas. ¡Ve más allá de tus sueños!"
  building_ps_distillation_complex: "Complejo de destilación"
  building_ps_chemical_complex: "Complejo químico"
  building_ps_synthesizers_complex: "Complejo de sintetizadores"
  building_ps_crowded_serf_houses: "Casas siervas abarrotadas"
  building_ps_crowded_serf_houses_desc: "Los siervos no son esclavos. Son recursos mucho más valiosos."
  building_ps_manorial_lands: "Tierras señoriales"
  building_ps_manorial_lands_desc: "Enormes haciendas controladas por nobles. Aunque en teoría son una merced de la corona, en la práctica son jurisdicciones autónomas."
  building_ps_bastion: "Bastión"
  building_ps_bastion_desc: "El centro militar del Planeta-Estado, donde se entrenan soldados leales juramentados a proteger la autonomía de su nación."
  job_archduke: "Archiduque"
  job_archduke_plural: "Archiduques"
  job_duke: "Duque"
  job_duke_plural: "Duques"
  job_count: "Conde"
  job_count_plural: "Condes"
  job_baron: "Barón"
  job_baron_plural: "Barones"
  planet_lost_autonomy: "Autonomía perdida"
  planet_lost_autonomy_desc: "Este era un Planeta-Estado soberano. Sus habitantes conservan un feroz sentido de independencia, esperando el momento adecuado para recuperarla."
  modifier_ps_egalitarian_commercial_pact: "Pacto comercial del Planeta-Estado (Igualitario)"
  modifier_ps_authoritarian_commercial_pact: "Pacto comercial del Planeta-Estado (Autoritario)"
  modifier_ps_militarist_commercial_pact: "Pacto comercial del Planeta-Estado (Militarista)"
